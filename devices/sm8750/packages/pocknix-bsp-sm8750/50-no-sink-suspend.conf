# Keep ALSA sinks alive: WirePlumber's default 5s idle suspend tears down the
# Qualcomm DSP audio path, so the first sound after idle is swallowed (and the
# DSP can pop on wake).  Same fix as SteamOS-adjacent distros use on this hw.
monitor.alsa.rules = [
  {
    matches = [
      {
        # Speaker ONLY (2026-09-29). Applied to every sink this also pinned the Headphones
        # PCM open from boot with the DSP route to its backend still off (nothing plugged), so
        # every headphone stream since ran into a dead front-end: "pw-play hangs", silence on
        # the jack. Letting the Headphones sink idle-suspend reopens the PCM fresh after the
        # jack/route change; the speaker keeps the no-suspend behaviour (idle pop).
        node.name = "~alsa_output.*Speaker.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
