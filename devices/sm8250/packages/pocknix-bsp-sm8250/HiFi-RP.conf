# HiFi-RP.conf - Retroid Pocket 5 / Flip 2 / Mini HiFi verb (pocknix-bsp-sm8250 40, 2026-10-15).
#
# Upstream alsa-ucm-conf codec sequences (the image ships 1.2.14) plus the vendor's operating point
# from the RP5's Android HAL (mixer_paths_qrd.xml): speakers at WSA digital 96 (+12 dB) with the
# wsa-macro companders ON and the amp COMP/BOOST on; headphones at RX digital 84 (0 dB), HPHL/R 20,
# class H ULP, with BOTH compander stages ON (rx-macro RX_COMP and codec HPH_COMP; upstream's
# wcd938x sequence leaves HPH_COMP off, which on this device ducked loud passages 18 dB when paired
# with RX_COMP on, measured 2026-10-06). Every control the verb depends on is written here so that
# the state is idempotent across WirePlumber re-parses. Measured against the Android reference
# (tone -8.6 dBFS at max, pumping -0.3 dB): see docs/audio-architecture-rp5-2026-10-15.md section 4.
SectionVerb {
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]
	DisableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones Playback"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.wcdhpe.File "/codecs/wcd938x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd938x/HeadphoneDisableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"
	# vendor operating point on top of the upstream sequences
	EnableSequence [
		cset "name='HPHL_COMP Switch' 1"
		cset "name='HPHR_COMP Switch' 1"
		cset "name='RX_RX0 Digital Volume' 84"
		cset "name='RX_RX1 Digital Volume' 84"
		cset "name='HPHL Volume' 20"
		cset "name='HPHR Volume' 20"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP"
		PlaybackChannels 2
		PlaybackRate 48000
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker Playback"
	Include.wsame.File "/codecs/qcom-lpass/wsa-macro/SpeakerEnableSeq.conf"
	Include.wsae.File "/codecs/wsa881x/SpeakerEnableSeq.conf"
	Include.wsad.File "/codecs/wsa881x/SpeakerDisableSeq.conf"
	Include.wsamd.File "/codecs/qcom-lpass/wsa-macro/SpeakerDisableSeq.conf"
	# vendor operating point: digital +12 dB (the upstream sequences set the companders and PA 12)
	EnableSequence [
		cset "name='WSA_RX0 Digital Volume' 96"
		cset "name='WSA_RX1 Digital Volume' 96"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Headset" {
	Comment "Headphone Microphone"
	Include.wcdmice.File "/codecs/wcd938x/HeadphoneMicEnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd938x/HeadphoneMicDisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/HeadphoneMicEnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/HeadphoneMicDisableSeq.conf"
	EnableSequence [
		cset "name='ADC2 Volume' 10"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC2"
		CaptureChannels 2
		CaptureRate 48000
		JackControl "Mic Jack"
	}
}
