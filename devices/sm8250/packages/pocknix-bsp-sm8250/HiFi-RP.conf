# HiFi-RP.conf — Retroid Pocket 5 / Flip 2 HiFi verb (pocknix-bsp-sm8250).
#
# HOLODOR 2026-10-11 (bsp 36): every piece of hardware state this verb needs is declared HERE,
# in sequences that are idempotent, because WirePlumber re-runs each device's EnableSequence
# every time it (re)creates the card. Until bsp 35 the speaker state lived in scripts that ran
# once (the boot heal, the session volume planter) while the upstream wsa-macro / wsa881x
# includes turned the companders back ON at every re-parse: the warble came back after any
# dock plug or docked wake. NO DisplayPort device IN THIS VERB (bsp 37, 2026-10-12): with no dock
# the DSP refuses to start the DISPLAY_PORT_RX AFE port (q6afe DEVICE_START -> ADSP_EALREADY/-22
# at prepare; kernel 0721 only fixed the drm/msm side), PipeWire's ACP probes every UCM device
# when it creates the card and drops the WHOLE HiFi profile on one failure = no Speaker, no
# Headphones on every undocked boot (proven by A/B on the device, 2026-10-12, as on 10-09).
# Dock audio is the separate "HDMI" verb (HDMI-RP.conf, bsp 39): a failure there can only take
# that profile down; pocknix-dp-audio-switch selects it while the dock's DisplayPort is up.
#
# Measured values (tools/rp5-audio, VideoMic NTG / UCA202): speaker companders OFF (10-05: they
# pumped 4-8 dB), WSA digital 122 (10-10 ceiling), PA 8 (steps above 8 add ~1 dB), boost 8.5 V
# (enum index 15 = "8.500 V"); headphones class-AB, RX companders OFF, digital 122 (10-06).

SectionVerb {
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones Playback"

	Include.wcdhpe.File "/codecs/wcd938x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd938x/HeadphoneDisableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	# The rx-macro half is written out here instead of including the stock
	# rx-macro/HeadphoneEnableSeq.conf. Stock turns the RX compander ON while the
	# codec's HPH compander is OFF, and picks the class-H amp mode. Measured on the
	# RP5 2026-10-06 (UCA202 line-in, tools/rp5-audio): every loud passage ducked
	# the whole signal by 18 dB for its duration (the "warble"), and with the
	# compander off class-H distorted a full-scale tone by 16 %.
	# Companders off + class AB (as upstream's wcd938x/HeadphoneABEnableSeq.conf
	# does for laptops with this codec): no ducking, 0.01 % distortion at full
	# scale, left and right within 0.2 dB.
	EnableSequence [
		cset "name='RX_HPH PWR Mode' LOHIFI"
		cset "name='RX HPH Mode' CLS_AB"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX_COMP1 Switch' 0"
		cset "name='RX_COMP2 Switch' 0"
		cset "name='RX_RX0 Digital Volume' 122"
		cset "name='RX_RX1 Digital Volume' 122"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker Playback"

	# wsa-macro (LPASS) path = upstream codecs/qcom-lpass/wsa-macro/SpeakerEnableSeq.conf with the
	# companders OFF and the digital makeup; wsa881x amplifiers = upstream
	# codecs/wsa881x/SpeakerEnableSeq.conf with the measured PA gain and boost level.
	EnableSequence [
		cset "name='WSA RX0 MUX' AIF1_PB"
		cset "name='WSA RX1 MUX' AIF1_PB"
		cset "name='WSA_RX0 INP0' RX0"
		cset "name='WSA_RX1 INP0' RX1"
		cset "name='WSA_COMP1 Switch' 0"
		cset "name='WSA_COMP2 Switch' 0"
		cset "name='WSA_RX0 Digital Volume' 122"
		cset "name='WSA_RX1 Digital Volume' 122"
		cset "name='SpkrLeft COMP Switch' 1"
		cset "name='SpkrLeft BOOST Switch' 1"
		cset "name='SpkrLeft DAC Switch' 1"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrLeft Smart Boost Level' 15"
		cset "name='SpkrLeft PA Volume' 8"
		cset "name='SpkrRight COMP Switch' 1"
		cset "name='SpkrRight BOOST Switch' 1"
		cset "name='SpkrRight DAC Switch' 1"
		cset "name='SpkrRight VISENSE Switch' 0"
		cset "name='SpkrRight Smart Boost Level' 15"
		cset "name='SpkrRight PA Volume' 8"
	]

	DisableSequence [
		cset "name='SpkrLeft COMP Switch' 0"
		cset "name='SpkrLeft BOOST Switch' 0"
		cset "name='SpkrLeft DAC Switch' 0"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrRight COMP Switch' 0"
		cset "name='SpkrRight BOOST Switch' 0"
		cset "name='SpkrRight DAC Switch' 0"
		cset "name='SpkrRight VISENSE Switch' 0"
		cset "name='WSA_RX0 INP0' ZERO"
		cset "name='WSA_RX1 INP0' ZERO"
		cset "name='WSA RX0 MUX' ZERO"
		cset "name='WSA RX1 MUX' ZERO"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Headset" {
	Comment "Headphone Microphone"

	Include.wcdmice.File "/codecs/wcd938x/HeadphoneMicEnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd938x/HeadphoneMicDisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/HeadphoneMicEnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/HeadphoneMicDisableSeq.conf"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC2"
		JackControl "Mic Jack"
	}
}
