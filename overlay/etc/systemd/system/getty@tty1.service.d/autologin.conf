# Auto-login the non-root 'deck' session user on the built-in display (tty1). deck's
# ~/.bash_profile execs the gamescope Big-Picture session; PipeWire (audio) only runs for a
# non-root user, which is why this is 'deck', not root. (root still reachable via SSH / other VTs.)
[Service]
ExecStart=
# Quiet handoff from the boot splash to the session (nothing may show on tty1 between them):
# --skip-login drops the "login: deck (automatic login)" line, --noissue/--nohints/--nohostname
# the rest of the banner, the screen IS cleared (no --noclear: pre-splash console text would
# otherwise reappear when plymouth quits), and the console cursor is hidden before agetty
# runs (the session supervisor keeps it hidden; the debug-shell path restores it).
ExecStartPre=-/bin/sh -c 'printf "\033[?25l" > /dev/%I'
ExecStart=-/usr/bin/agetty --autologin deck --skip-login --noissue --nohints --nohostname %I 38400 linux
